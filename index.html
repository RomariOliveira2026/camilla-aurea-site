<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#4B1120" />
    <meta
      name="description"
      content="Camilla Áurea — desenvolvimento pessoal feminino. Poder, Valor e Luxo Afetivo."
    />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>Camilla Áurea — Poder, Valor e Luxo Afetivo</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('camilla-aurea-theme')
          if (theme === 'night' || theme === 'day') {
            document.documentElement.setAttribute('data-theme', theme)
            if (theme === 'night') {
              var meta = document.querySelector('meta[name="theme-color"]')
              if (meta) meta.setAttribute('content', '#1a0a0f')
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Este site precisa de JavaScript ativado para ser exibido.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
