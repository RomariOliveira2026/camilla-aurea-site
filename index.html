    <script>
      (function () {
        try {
          var theme = localStorage.getItem('camilla-aurea-theme')
          if (theme === 'night' || theme === 'day') {
            document.documentElement.setAttribute('data-theme', theme)
            if (theme === 'night') {
              var meta = document.querySelector('meta[name="theme-color"]')
              if (meta) meta.setAttribute('content', '#1a0a0f')
            }
          }
        } catch (e) {}
      })()
    </script>
